<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문해력 특보</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE6D9;
    --card:#F6F3E9;
    --ink:#201F1B;
    --ink-soft:#615B4D;
    --red:#B23A2E;
    --blue:#33565F;
    --rule:#C8C0A8;
    --white:#FFFDF7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 80px;
  }
  .sheet{
    width:100%;
    max-width:640px;
  }
  .masthead{
    border-bottom:6px double var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  .masthead-meta{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.03em;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .masthead h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:38px;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .masthead p{
    margin:0;
    font-size:14px;
    color:var(--ink-soft);
    font-family:'Noto Serif KR', serif;
    font-style:italic;
  }
  .screen{display:none;}
  .screen.active{display:block;}

  /* intro */
  .lead-box{
    background:var(--card);
    border:1px solid var(--rule);
    padding:22px 20px;
    margin-bottom:20px;
  }
  .lead-box h2{
    font-family:'Noto Serif KR', serif;
    font-size:20px;
    margin:0 0 10px;
  }
  .lead-box p{
    font-size:14.5px;
    line-height:1.7;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:6px;
    letter-spacing:0.04em;
  }
  .field input{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--ink);
    background:var(--white);
    font-size:15px;
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--blue); outline-offset:1px;}
  .btn{
    display:inline-block;
    width:100%;
    text-align:center;
    padding:14px 16px;
    background:var(--ink);
    color:var(--white);
    border:none;
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.02em;
    cursor:pointer;
  }
  .btn:disabled{background:#a39c8c; cursor:not-allowed;}
  .btn:hover:not(:disabled){background:var(--red);}
  .btn-ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--ink);
  }
  .btn-ghost:hover:not(:disabled){background:var(--ink); color:var(--white);}
  .btn-row{display:flex; gap:10px; margin-top:16px;}
  .btn-row .btn{width:auto; flex:1;}

  .error-msg{color:var(--red); font-size:12.5px; margin-top:-6px; margin-bottom:12px; display:none;}

  /* quiz */
  .progress-line{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    border-bottom:1px solid var(--rule);
    padding-bottom:8px;
    margin-bottom:16px;
  }
  .progress-bar{
    height:3px;
    background:var(--rule);
    margin-bottom:22px;
    position:relative;
  }
  .progress-bar-fill{
    position:absolute; left:0; top:0; height:100%;
    background:var(--red);
    transition:width .3s ease;
  }
  .q-card{
    background:var(--card);
    border:1px solid var(--rule);
    padding:22px 20px;
  }
  .q-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--red);
    border:1px solid var(--red);
    display:inline-block;
    padding:2px 8px;
    margin-bottom:12px;
    letter-spacing:0.05em;
  }
  .q-passage{
    background:var(--white);
    border-left:3px solid var(--blue);
    padding:12px 14px;
    font-size:13.5px;
    line-height:1.75;
    color:var(--ink-soft);
    margin-bottom:16px;
    white-space:pre-line;
  }
  .q-text{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:19px;
    line-height:1.5;
    margin:0 0 18px;
  }
  .options{list-style:none; margin:0; padding:0;}
  .option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 10px;
    border-bottom:1px solid var(--rule);
    cursor:pointer;
    font-size:15px;
    line-height:1.55;
  }
  .option:last-child{border-bottom:none;}
  .option:hover{background:rgba(178,58,46,0.06);}
  .option .mark{
    flex:0 0 22px;
    height:22px;
    width:22px;
    border:2px solid var(--ink);
    border-radius:50%;
    position:relative;
    margin-top:1px;
  }
  .option.selected .mark{border-color:var(--red);}
  .option.selected .mark::after{
    content:'';
    position:absolute;
    left:50%; top:50%;
    width:11px; height:11px;
    background:var(--red);
    border-radius:50%;
    transform:translate(-50%,-50%);
  }
  .option.selected{background:rgba(178,58,46,0.09); font-weight:500;}

  /* result */
  .stamp-wrap{text-align:center; margin-bottom:22px;}
  .stamp{
    display:inline-block;
    border:4px solid var(--red);
    color:var(--red);
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:22px;
    padding:10px 22px;
    transform:rotate(-4deg);
    letter-spacing:0.08em;
  }
  .score-box{
    background:var(--card);
    border:1px solid var(--rule);
    padding:26px 20px;
    text-align:center;
    margin-bottom:18px;
  }
  .score-num{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:52px;
    line-height:1;
  }
  .score-num span{font-size:22px; color:var(--ink-soft);}
  .score-caption{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .review-list{margin-top:18px;}
  .review-item{
    display:flex;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--rule);
    font-size:13.5px;
    align-items:flex-start;
  }
  .review-item .badge{
    flex:0 0 auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    padding:2px 6px;
    margin-top:2px;
    border:1px solid currentColor;
  }
  .explain{
    margin-top:6px;
    padding:8px 10px;
    background:var(--white);
    border-left:2px solid var(--blue);
    color:var(--ink-soft);
    font-size:12.5px;
    line-height:1.6;
  }
  .badge.ok{color:var(--blue);}
  .badge.no{color:var(--red);}
  .submit-status{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:14px;
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="masthead">
    <div class="masthead-meta">
      <span id="issueDate"></span>
      <span>제 1호 · 문해력 진단 특보</span>
    </div>
    <h1>문해력 특보</h1>
    <p>당신의 문해력, 이대로 괜찮을까요?</p>
  </div>

  <!-- 0. 인트로 -->
  <div class="screen active" id="screen-intro">
    <div class="lead-box">
      <h2>퀴즈 참여</h2>
      <p>중의적 표현, 관용구, 지문 독해, 그리고 뉴스에 자주 등장하는 오해받는 우리말 표현까지 —
      총 17문항으로 여러분의 문해력을 점검하는 퀴즈입니다. 시작 전, 학번과 이름을 남겨 주세요.</p>
      <div class="field">
        <label>학번</label>
        <input type="text" id="studentId" placeholder="예: 10203" inputmode="numeric">
      </div>
      <div class="field">
        <label>이름</label>
        <input type="text" id="studentName" placeholder="예: 홍길동">
      </div>
      <div class="error-msg" id="introError">학번과 이름을 모두 입력해 주세요.</div>
      <button class="btn" id="startBtn">지면 넘기기 — 시작하기</button>
    </div>
  </div>

  <!-- 1. 퀴즈 -->
  <div class="screen" id="screen-quiz">
    <div class="progress-line">
      <span id="progressText">지면 1 / 17</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>

    <div class="q-card">
      <div class="q-tag" id="qTag">문항 01</div>
      <div class="q-passage" id="qPassage" style="display:none;"></div>
      <div class="q-text" id="qText"></div>
      <ul class="options" id="qOptions"></ul>
    </div>

    <div class="btn-row">
      <button class="btn btn-ghost" id="prevBtn">이전 지면</button>
      <button class="btn" id="nextBtn" disabled>다음 지면</button>
    </div>
  </div>

  <!-- 2. 결과 -->
  <div class="screen" id="screen-result">
    <div class="stamp-wrap">
      <span class="stamp" id="resultStamp">정정 완료</span>
    </div>
    <div class="score-box">
      <div class="score-num"><span id="scoreNum">0</span><span> / 17</span></div>
      <div class="score-caption" id="scoreCaption">— 채점 완료 —</div>
    </div>
    <div class="submit-status" id="submitStatus">결과를 선생님께 전달하는 중...</div>
  </div>

</div>

<script>
/* ====== 배포한 구글 앱스 스크립트 웹앱 URL ====== */
const GAS_URL = "https://script.google.com/macros/s/AKfycbxZR0rn9xKoWcbXJw1vw7x4xes7yOaUBOn8gv08aQ3c4dMSWs_Wn-6euEbA8brNRZCfVA/exec";
/* ============================================================= */

const questions = [
  {
    tag:"문항 01",
    text:"다음 중 중의적으로 해석되지 않는 문장은?",
    options:[
      "아직 사람들이 다 오지 않았다.",
      "나는 어제 미국에서 온 친구를 만났다.",
      "아버지는 어머니보다 나를 더 좋아하신다.",
      "지섭이를 보고 싶어 하는 친구들이 많이 있다."
    ],
    answer:3,
    explain:"④는 '지섭이를 그리워하는 친구가 많다'는 한 가지 뜻으로만 읽혀요. 나머지는 각각 '전혀 안 왔다/아직 다 안 왔다', '어제=온 시점/만난 시점', '아버지가 나를 더 좋아함/어머니보다 내가 더 좋아함'처럼 두 가지로 읽힐 수 있어요."
  },
  {
    tag:"문항 02",
    text:"다음 관용구의 의미가 적절하지 않은 것은?",
    options:[
      "고배를 마시다 → 실패 따위의 쓰라린 일을 당하다.",
      "막차를 타다 → 끝나갈 무렵에 뒤늦게 뛰어들다.",
      "상투를 잡다 → 가장 높은 시세에 주식을 매입하다.",
      "코 빠지다 → 새로운 생명이 탄생하다."
    ],
    answer:3,
    explain:"'코 빠지다'는 '기운이 없어지고 풀이 죽다'라는 뜻이에요. '새로운 생명이 탄생하다'는 관용구의 실제 의미와 관련이 없어요."
  },
  {
    tag:"문항 03",
    text:"밑줄 친 두 단어의 다듬은 말을 순서대로 나열한 것은?",
    passage:"A - 재계약 시 급여는 익월 10일에 지급됩니다.\nB - 요청하신 서류는 명일 메일로 전달드리겠습니다.",
    options:[
      "다음달 - 오늘",
      "이번달 - 내일",
      "다음달 - 내일",
      "이번달 - 오늘"
    ],
    answer:2,
    explain:"'익월'은 '다음 달', '명일'은 '내일'을 뜻하는 한자어예요. 두 단어 모두 일상에서 자주 오해를 사는 표현이에요."
  },
  {
    tag:"문항 04",
    text:"속담을 사용한 표현으로 적절하지 않은 것은?",
    options:[
      "그는 '처삼촌 뫼에 벌초하듯' 일한다.",
      "그는 '놓아 먹인 망아지'처럼 버릇없이 행동한다.",
      "둘이 만나기만 하면 '소 닭 보듯' 으르렁거린다.",
      "그는 '개 머루 먹듯' 정확히 모르면서 아는 체하였다."
    ],
    answer:2,
    explain:"'소 닭 보듯'은 서로 무심하고 관심 없어 하는 모습을 뜻해요. 다투거나 으르렁거리는 모습과는 반대되는 의미예요."
  },
  {
    tag:"문항 05",
    text:"다음 말을 들은 상대의 반응으로 적절한 것은?",
    passage:"\u201c그 학생은 너무 이지적이야.\u201d",
    options:[
      "너는 사람을 얕잡아 보는 경향이 있어.",
      "그 학생은 자기만 아는가 보구나?",
      "여러모로 똑똑한 학생인가 보네.",
      "그 학생이 너한테 뭐 잘못했니?"
    ],
    answer:2,
    explain:"'이지적이다'는 '이성과 지혜에 따라 사물을 판단하는 성질이 있다', 즉 똑똑하고 논리적이라는 뜻의 긍정적인 표현이에요."
  },
  {
    tag:"문항 06",
    text:"다음 문장에서 밑줄 친 단어의 표기가 옳은 것은?",
    options:[
      "T사는 2022년 미래지향사업을 위해 혁신 추진위원회를 발촉했다.",
      "김대리는 행사 완료 후 대행사에 공과잡비를 결재했다.",
      "이 과장은 프로젝트가 끝나면 으례 팀원들과 회식을 한다.",
      "요즘 회사원들은 자기 개발을 위해 퇴근 후 많은 시간을 할애한다."
    ],
    answer:3,
    explain:"'자기 개발'이 맞는 표기예요. '발촉'은 '발족', '결재'해야 할 자리에 '결제'(돈을 지불함)를 써야 하고, '으례'는 '으레'로 써야 해요."
  },
  {
    tag:"문항 07",
    text:"문장의 자연스러운 연결을 위해 빈칸에 들어갈 적절한 말은?",
    passage:"한국의 독서플랫폼 M사에서는 최근 시선 추적 기능을 도입했다. 이는 사용자의 시선을 추적해 책 페이지를 넘길 수 있는 기술이다. ( ) 집안일이나 운동 등 다른 활동을 하면서 독서를 편하게 즐길 수 있다. 해당 서비스가 많은 사람들에게 보편화되어, 저마다의 다양한 일상 속에 독서가 녹아들기 바란다고 회사 측은 설명했다.",
    options:[
      "아니 근데",
      "그러나",
      "그럼에도 불구하고",
      "이를 통해"
    ],
    answer:3,
    explain:"'( ) 집안일이나 운동 등 다른 활동을 하면서'는 앞 문장의 기술 덕분에 생기는 결과이므로, 수단·방법을 나타내는 '이를 통해'가 자연스러워요."
  },
  {
    tag:"문항 08",
    text:"다음 글을 올바르게 이해한 사람은?",
    passage:"디지털 기기와 콘텐츠의 확산에 따라 전 세계적으로 문해력이 낮아지고 있다. 디지털 콘텐츠에 적응한 사람은 글의 맥락과 핵심 내용을 이해하지 못한 채 필요한 정보만 획득하여 읽기 때문이다. 문해력은 독서를 통해 높일 수 있지만, 무조건 독서량이 많다고 해서 문해력이 높아지는 것은 아니다. 문해력은 글을 읽고 그 내용을 얼마나 정확하게 이해했는가와 관련이 있으므로 문장과 문장 사이의 관계를 이해하며 읽는 것이 매우 중요하다. 즉 문해력을 높이기 위해서는 글 전체의 문장 간의 관계를 이해해야 한다.",
    options:[
      "송이: 문해력은 독서량만 늘려도 높일 수 있구나.",
      "서진: 전체 내용만 대략적으로 파악해도 글을 제대로 읽었다고 할 수 있지!",
      "혜주: 잘 읽고 잘 이해하려면 역시 시력부터 좋아야 해.",
      "준혁: 글의 맥락을 파악하고 읽는 것이 중요하군!"
    ],
    answer:3,
    explain:"지문은 문해력을 높이려면 '문장과 문장 사이의 관계, 글 전체의 맥락'을 이해하며 읽어야 한다고 말하고 있어요. 준혁의 말이 이 핵심과 정확히 일치해요."
  },
  {

let current = 0;
const answers = new Array(questions.length).fill(null);

const $ = id => document.getElementById(id);

$("issueDate").textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric'});

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}

$("startBtn").addEventListener('click', ()=>{
  const id = $("studentId").value.trim();
  const name = $("studentName").value.trim();
  if(!id || !name){
    $("introError").style.display = 'block';
    return;
  }
  $("introError").style.display = 'none';
  showScreen('screen-quiz');
  renderQuestion();
});

function renderQuestion(){
  const q = questions[current];
  $("qTag").textContent = q.tag;
  $("qText").textContent = q.text;
  if(q.passage){
    $("qPassage").style.display = 'block';
    $("qPassage").textContent = q.passage;
  } else {
    $("qPassage").style.display = 'none';
  }
  const list = $("qOptions");
  list.innerHTML = '';
  q.options.forEach((opt, i)=>{
    const li = document.createElement('li');
    li.className = 'option' + (answers[current]===i ? ' selected' : '');
    li.innerHTML = `<span class="mark"></span><span>${opt}</span>`;
    li.addEventListener('click', ()=>{
      answers[current] = i;
      renderQuestion();
    });
    list.appendChild(li);
  });

  $("progressText").textContent = `지면 ${current+1} / ${questions.length}`;
  $("progressPct").textContent = Math.round(((current+1)/questions.length)*100) + '%';
  $("progressFill").style.width = ((current+1)/questions.length*100) + '%';

  $("prevBtn").disabled = current===0;
  $("nextBtn").disabled = answers[current]===null;
  $("nextBtn").textContent = current===questions.length-1 ? '채점하기' : '다음 지면';
}

$("prevBtn").addEventListener('click', ()=>{
  if(current>0){ current--; renderQuestion(); }
});

$("nextBtn").addEventListener('click', ()=>{
  if(answers[current]===null) return;
  if(current < questions.length-1){
    current++;
    renderQuestion();
  } else {
    finishQuiz();
  }
});

function finishQuiz(){
  let score = 0;
  questions.forEach((q,i)=>{
    const correct = answers[i]===q.answer;
    if(correct) score++;
  });

  $("scoreNum").textContent = score;
  const pct = Math.round(score/questions.length*100);
  $("scoreCaption").textContent = `— 정답률 ${pct}% —`;
  $("resultStamp").textContent = pct >= 80 ? '정확 보도' : (pct >= 50 ? '부분 정정' : '전면 정정');

  window._finalScore = score;
  window._finalStudentId = $("studentId").value.trim();
  window._finalStudentName = $("studentName").value.trim();

  showScreen('screen-result');
  submitResult();
}

function submitResult(){
  $("submitStatus").textContent = '결과를 선생님께 전달하는 중...';

  const selectedAnswers = questions.map((q,i)=>{
    return answers[i]===null ? '미응답' : q.options[answers[i]];
  });

  const payload = {
    studentId: window._finalStudentId,
    studentName: window._finalStudentName,
    score: window._finalScore,
    total: questions.length,
    timestamp: new Date().toISOString(),
    answers: selectedAnswers
  };

  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).then(()=>{
    $("submitStatus").textContent = '선생님께 자동으로 전달되었습니다. 수고하셨습니다.';
  }).catch(()=>{
    $("submitStatus").textContent = '전달에 실패했습니다. 선생님께 화면을 보여주세요.';
  });
}
